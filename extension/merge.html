<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge saved tabs</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { background: var(--card); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 24px 0 8px; }
  #drop {
    display: block; margin-top: 20px; padding: 32px 16px; text-align: center; cursor: pointer;
    border: 2px dashed var(--border); border-radius: 10px; background: var(--bg);
  }
  #drop.over { border-color: var(--accent); }
  #picker { display: none; }
  ul { list-style: none; padding: 0; margin: 0; }
  #files li {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px;
  }
  #files .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #files button { padding: 2px 8px; }
  #domains { display: flex; flex-wrap: wrap; gap: 6px; }
  #domains li { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
  #status { margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Merge saved tabs</h1>
  <p class="muted">Pick several files saved by Tab Sorter. Their links are combined by domain into one new file, with duplicates removed. The original files are left untouched.</p>

  <label id="drop" for="picker">
    <strong>Choose files</strong> or drop them here
    <div class="muted">.html files from Tab Sorter (other HTML pages work too; their links are collected)</div>
  </label>
  <input type="file" id="picker" accept=".html,.htm,text/html" multiple>

  <section id="loaded" hidden>
    <h2>Files</h2>
    <ul id="files"></ul>
    <h2 id="summary"></h2>
    <ul id="domains"></ul>
    <div class="actions">
      <button id="merge" class="primary">Save merged file</button>
      <button id="clear">Clear</button>
    </div>
  </section>
  <p id="status" role="status"></p>
</main>
<script src="options.js"></script>
<script src="lib.js"></script>
<script src="merge.js"></script>
</body>
</html>
